services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Stockage S3-compatible. MinIO n'est plus publié en image prête à l'emploi (Docker Hub / Quay) ;
  # SeaweedFS expose la même API S3. Version figée volontairement (01 §21).
  s3:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "{\"identities\":[{\"name\":\"app\",\"credentials\":[{\"accessKey\":\"$$S3_ACCESS_KEY\",\"secretKey\":\"$$S3_SECRET_KEY\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3_data:/data]
    ports: ["127.0.0.1:9000:9000"]
  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL}
      TRUST_PROXY: 1 # nginx devant l'API
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: mysql://app_runtime:${APP_RUNTIME_PASSWORD}@db:3306/${MYSQL_DATABASE}
      MIGRATE_DATABASE_URL: mysql://app_migrate:${APP_MIGRATE_PASSWORD}@db:3306/${MYSQL_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: http://s3:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["4200:80"]

volumes:
  db_data:
  s3_data:
