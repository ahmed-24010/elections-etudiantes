server {
  listen 80;
  root /usr/share/nginx/html;

  # L'API (et Swagger) passent par le même domaine que le frontend : pas de CORS, pas d'URL en dur.
  # Dépôt d'attestation : 5 Mo max côté API (D-23) ; nginx doit laisser passer un peu plus (multipart) pour que l'API réponde 413 elle-même.
  client_max_body_size 6m;

  # Au-delà de 6 Mo, nginx répond lui-même : en JSON, dans le format d'erreur de l'API (statusCode, message, timestamp ;
  # pas de « path » : $request_uri n'est pas échappé en JSON). Le message est le même code que l'API (TOO_LARGE), pour que
  # l'interface affiche « Fichier trop volumineux » dans les deux cas.
  error_page 413 @too_large;
  location @too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    return 413 '{"statusCode":413,"message":"TOO_LARGE","timestamp":"$time_iso8601"}';
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Traductions et page d'entrée : toujours revalidées (ETag). Sans cela, un navigateur peut garder un ancien fichier de
  # traductions avec le nouveau code et afficher des clés brutes (ex. « institution.faculty »). Les fichiers JS/CSS ont un
  # nom haché, ils n'ont pas ce problème. add_header dans un location annule ceux du server : on les répète.
  location /assets/i18n/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  location / { try_files $uri $uri/ /index.html; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
