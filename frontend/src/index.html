<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الانتخابات الطلابية · Élections étudiantes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Choisit la feuille Bootstrap (RTL ou LTR) avant le premier affichage, pour éviter un flash.
    (function () {
      var lang = 'ar';
      try { lang = localStorage.getItem('lang') === 'fr' ? 'fr' : 'ar'; } catch (e) {}
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.write('<link id="bootstrap-css" rel="stylesheet" href="assets/css/' +
        (lang === 'ar' ? 'bootstrap.rtl.min.css' : 'bootstrap.min.css') + '">');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
